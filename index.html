<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f766e"><meta name="description" content="Private offline personal finance tracker in BDT"><link rel="manifest" href="manifest.webmanifest"><title>Smart Wallet · BDT</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#172b38;background:#f2f6f8}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{display:grid;grid-template-columns:235px 1fr;min-height:100vh}.side{background:#102d38;color:#e5f6f4;padding:28px 17px;position:sticky;top:0;height:100vh}.brand{font-size:22px;font-weight:800;margin:0 10px 35px}.brand span{color:#4adeb8}.nav{display:block;width:100%;border:0;text-align:left;background:none;color:#c3d7dc;padding:13px 15px;border-radius:11px;margin:3px 0}.nav.active,.nav:hover{background:#1e5059;color:#fff}.main{padding:32px;max-width:1450px;width:100%;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:25px}.top h1{font-size:27px;margin:0}.muted{color:#72848f;font-size:13px}.btn{border:0;background:#0f766e;color:white;padding:11px 17px;border-radius:10px;font-weight:650}.btn:hover{background:#0a5d56}.btn.secondary{background:#e5f2f0;color:#09655e}.btn.danger{background:#fee8e8;color:#a92d2d}.btn.small{padding:7px 10px;font-size:12px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.card,.panel{background:#fff;border:1px solid #e7edf0;border-radius:17px;padding:20px;box-shadow:0 5px 25px #24455709}.card small{color:#6a818b}.card strong{display:block;font-size:25px;margin:12px 0 3px;overflow-wrap:anywhere}.accent{background:linear-gradient(125deg,#0e766e,#125d74);color:white}.accent small,.accent .muted{color:#c7e7e4}.two{display:grid;grid-template-columns:1.2fr 1fr;gap:17px;margin-top:18px}.panel h2{font-size:17px;margin:0 0 18px}.listrow{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #edf1f3}.listrow:last-child{border:0}.listrow b{font-size:14px}.pill{display:inline-block;background:#e7f5f1;color:#087568;padding:4px 9px;border-radius:20px;font-size:11px}.negative{color:#c04949}.positive{color:#0b866a}.bar{height:9px;background:#eaf0f1;border-radius:20px;overflow:hidden;margin:10px 0}.fill{height:100%;background:#15a389;border-radius:20px}.fill.over{background:#e77965}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:17px}.toolbar input,.toolbar select{max-width:230px}.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:650}.field input,.field select,.field textarea,.toolbar input,.toolbar select{padding:11px 12px;border:1px solid #dbe5e9;border-radius:9px;background:white;min-width:0;color:#1c3340}.field textarea{min-height:70px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.wide{grid-column:1/-1}.section{margin-top:22px}.hidden{display:none!important}.modalwrap{position:fixed;inset:0;background:#091e29a8;display:flex;align-items:center;justify-content:center;padding:18px;z-index:5}.modal{width:min(540px,100%);max-height:92vh;overflow:auto;background:white;padding:24px;border-radius:18px}.modal h2{margin:0 0 18px}.actions{display:flex;gap:9px;justify-content:flex-end;margin-top:20px}.empty{padding:30px;text-align:center;color:#80939a}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:13px 10px;border-bottom:1px solid #edf1f3;white-space:nowrap}th{color:#6c838d;font-weight:600}.toast{position:fixed;bottom:20px;right:20px;background:#183d47;color:white;padding:13px 20px;border-radius:12px;z-index:10;display:none}.mobileNav{display:none}.hint{font-size:12px;color:#71838c;margin-top:9px}canvas{width:100%;height:230px}input[type=file]{max-width:100%}@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}@media(max-width:700px){.shell{display:block}.side{display:none}.main{padding:18px 14px 90px}.top h1{font-size:22px}.cards{gap:9px}.card,.panel{padding:15px}.card strong{font-size:19px}.mobileNav{position:fixed;bottom:0;left:0;right:0;background:#102d38;display:flex;overflow:auto;z-index:3;padding:8px;gap:5px}.mobileNav button{flex:1;min-width:67px;background:none;border:0;color:#e2f1ef;font-size:10px;padding:8px 3px}.mobileNav button.active{background:#26656a;border-radius:9px}.formgrid{grid-template-columns:1fr}.budget-line{grid-template-columns:1fr 110px auto!important}.top{align-items:start}.top .btn{font-size:12px;padding:9px}}
</style></head><body><div class="shell"><aside class="side"><div class="brand">◈ Smart<span>Wallet</span></div><div id="nav"></div><p class="muted" style="position:absolute;bottom:20px;left:27px">Private · Local-first · ৳ BDT</p></aside><main class="main"><div class="top"><div><h1 id="pageTitle">Dashboard</h1><div class="muted" id="subtitle">Your personal financial overview</div></div><button class="btn" onclick="openEntry()">＋ Add transaction</button></div><div id="content"></div></main></div><nav class="mobileNav" id="mobileNav"></nav><div id="modalRoot"></div><div class="toast" id="toast"></div><script>
'use strict';const KEY='smartwallet_v1';const pages=['Dashboard','Transactions','Budgets','Dues','Deposits','Reports','Settings'];const categories=[];const today=()=>new Date().toLocaleDateString('en-CA');const month=()=>today().slice(0,7);const money=n=>'৳ '+Number(n||0).toLocaleString('en-BD',{minimumFractionDigits:0,maximumFractionDigits:2});const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const num=x=>Number(x)||0;let db;function blank(){return {transactions:[],budgets:{},dues:[],deposits:[],settings:{monthlyGoal:0}}}function load(){try{const d=JSON.parse(localStorage.getItem(KEY));return d&&Array.isArray(d.transactions)&&Array.isArray(d.dues)&&Array.isArray(d.deposits)&&typeof d.budgets==='object'?{...blank(),...d}:blank()}catch{return blank()}}db=load();let page='Dashboard',selectedMonth=month(),editId=null;function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){alert('Could not save. Browser storage may be full or disabled. Export a backup.');return false}}function toast(t){const x=document.getElementById('toast');x.textContent=t;x.style.display='block';clearTimeout(window._toast);window._toast=setTimeout(()=>x.style.display='none',2800)}function go(p){page=p;render()}function navHtml(mobile=false){return pages.map((p,i)=>`<button class="${mobile?'':'nav '}${page===p?'active':''}" onclick="go('${p}')">${['◫','⇄','▥','↔','▣','▤','⚙'][i]} ${p}</button>`).join('')}function totals(m=selectedMonth){let a=db.transactions.filter(t=>t.date.slice(0,7)===m);return {income:a.filter(t=>t.type==='income').reduce((s,t)=>s+num(t.amount),0),expense:a.filter(t=>t.type==='expense').reduce((s,t)=>s+num(t.amount),0)}}function balance(){return db.transactions.reduce((s,t)=>s+(t.type==='income'?1:-1)*num(t.amount),0)}function budget(m=selectedMonth){return db.budgets[m]||{total:0,categories:{}}}function dateFmt(s){if(!s)return '—';const [y,m,d]=s.split('-');return `${d} ${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][Number(m)-1]} ${y}`}function filterMonth(){return `<label class="field">Month<input type="month" value="${selectedMonth}" onchange="selectedMonth=this.value;render()"></label>`}function render(){document.getElementById('nav').innerHTML=navHtml();document.getElementById('mobileNav').innerHTML=navHtml(true);document.getElementById('pageTitle').textContent=page;document.getElementById('subtitle').textContent=page==='Dashboard'?'Your personal financial overview':'Your finances, organized';document.getElementById('content').innerHTML=({Dashboard:dashboard,Transactions:transactions,Budgets:budgets,Dues:dues,Deposits:deposits,Reports:reports,Settings:settings})[page]();if(page==='Reports')setTimeout(drawChart,0)}function row(t){return `<div class="listrow"><div><b>${esc(t.note||t.category)}</b><div class="muted">${esc(t.category)} · ${dateFmt(t.date)} · ${esc(t.account||'Cash')}</div></div><div style="text-align:right"><b class="${t.type==='income'?'positive':'negative'}">${t.type==='income'?'+':'−'}${money(t.amount)}</b><div><button class="btn small secondary" onclick="openEntry('${t.id}')">Edit</button> <button class="btn small danger" onclick="remove('transactions','${t.id}')">Delete</button></div></div></div>`}function upcoming(){let list=[];db.dues.filter(d=>num(d.amount)>num(d.paid)&&d.dueDate).forEach(d=>list.push({name:`${d.type==='receivable'?'Receive from':'Pay to'} ${d.name}`,date:d.dueDate,amount:num(d.amount)-num(d.paid)}));db.deposits.forEach(d=>{if(d.maturityDate)list.push({name:`${d.type} maturity: ${d.name}`,date:d.maturityDate,amount:num(d.maturityAmount)});if(d.type==='DPS'&&d.nextPaymentDate)list.push({name:`DPS installment: ${d.name}`,date:d.nextPaymentDate,amount:num(d.installment)})});return list.filter(x=>x.date>=today()).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,7)}function dashboard(){const t=totals(),b=budget(),remain=num(b.total)-t.expense,receivable=db.dues.filter(x=>x.type==='receivable').reduce((s,x)=>s+Math.max(0,num(x.amount)-num(x.paid)),0),payable=db.dues.filter(x=>x.type==='payable').reduce((s,x)=>s+Math.max(0,num(x.amount)-num(x.paid)),0);return `<div class="toolbar">${filterMonth()}</div><div class="cards"><div class="card accent"><small>Available wallet balance (all time)</small><strong>${money(balance())}</strong><div class="muted">Income less expenses</div></div><div class="card"><small>Monthly income</small><strong class="positive">${money(t.income)}</strong></div><div class="card"><small>Monthly expenses</small><strong class="negative">${money(t.expense)}</strong></div><div class="card"><small>Budget remaining</small><strong>${money(remain)}</strong><div class="bar"><div class="fill ${remain<0?'over':''}" style="width:${b.total?Math.min(100,t.expense/b.total*100):0}%"></div></div><small>Budget ${money(b.total)}</small></div></div><div class="two"><div class="panel"><h2>Recent transactions</h2>${db.transactions.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6).map(row).join('')||'<div class="empty">No transactions yet. Add your first income or expense.</div>'}</div><div class="panel"><h2>Upcoming reminders</h2>${upcoming().map(x=>`<div class="listrow"><div><b>${esc(x.name)}</b><div class="muted">${dateFmt(x.date)}</div></div><b>${money(x.amount)}</b></div>`).join('')||'<div class="empty">No upcoming due dates or maturities.</div>'}<p class="hint">Reminders appear when you open the app; no background push notifications.</p></div></div><div class="two"><div class="panel"><h2>Outstanding balances</h2><div class="listrow">Receivable <b class="positive">${money(receivable)}</b></div><div class="listrow">Payable <b class="negative">${money(payable)}</b></div></div><div class="panel"><h2>Quick actions</h2><div class="toolbar"><button class="btn" onclick="openEntry()">Add expense / income</button><button class="btn secondary" onclick="go('Budgets')">Plan budget</button><button class="btn secondary" onclick="go('Deposits')">Track DPS / FD</button></div></div></div>`}function transactions(){const a=db.transactions.filter(t=>t.date.slice(0,7)===selectedMonth).sort((x,y)=>y.date.localeCompare(x.date));return `<div class="toolbar">${filterMonth()}<button class="btn" onclick="openEntry()">＋ Add transaction</button></div><div class="panel"><h2>Transactions (${a.length})</h2>${a.map(row).join('')||'<div class="empty">No transactions for this month.</div>'}</div>`}function budgets(){const b=budget(),t=totals(),names=Object.keys(b.categories||{});return `<div class="toolbar">${filterMonth()}<button class="btn" onclick="openBudget()">Set monthly budget</button><button class="btn secondary" onclick="copyPrevious()">Copy previous month</button></div><div class="cards"><div class="card"><small>Planned budget</small><strong>${money(b.total)}</strong></div><div class="card"><small>Spent</small><strong>${money(t.expense)}</strong></div><div class="card"><small>Remaining</small><strong>${money(num(b.total)-t.expense)}</strong></div><div class="card"><small>Spending rate</small><strong>${b.total?Math.round(t.expense/b.total*100):0}%</strong></div></div><div class="panel section"><h2>Your budget categories</h2>${names.map(c=>{const used=db.transactions.filter(x=>x.type==='expense'&&x.date.slice(0,7)===selectedMonth&&x.category===c).reduce((s,x)=>s+num(x.amount),0),limit=num(b.categories[c]);return `<div class="listrow"><div style="flex:1"><b>${esc(c)}</b><div class="muted">Spent ${money(used)} / Planned ${money(limit)}</div><div class="bar"><div class="fill ${used>limit?'over':''}" style="width:${limit?Math.min(100,used/limit*100):used?100:0}%"></div></div></div><b>${money(limit-used)}</b></div>`}).join('')||'<div class="empty">No categories yet. Select Set monthly budget to create your own.</div>'}<p class="hint">Create any category name you like. Use the same category when adding an expense to track its budget.</p></div>`}function dues(){return `<div class="toolbar"><button class="btn" onclick="openDue()">＋ Add receivable / payable</button></div><div class="panel"><h2>Money owed and owing</h2><div class="tablewrap"><table><thead><tr><th>Type</th><th>Person / reason</th><th>Original</th><th>Paid / received</th><th>Outstanding</th><th>Due</th><th>Actions</th></tr></thead><tbody>${db.dues.map(d=>`<tr><td><span class="pill">${esc(d.type)}</span></td><td>${esc(d.name)}</td><td>${money(d.amount)}</td><td>${money(d.paid)}</td><td>${money(Math.max(0,num(d.amount)-num(d.paid)))}</td><td>${dateFmt(d.dueDate)}</td><td><button class="btn small secondary" onclick="openDue('${d.id}')">Edit / settle</button> <button class="btn small danger" onclick="remove('dues','${d.id}')">Delete</button></td></tr>`).join('')}</tbody></table></div>${!db.dues.length?'<div class="empty">No receivables or payables yet.</div>':''}<p class="hint">Settlements are tracked here. To reflect cash movement in wallet balance, also add the corresponding income or expense transaction.</p></div>`}function deposits(){return `<div class="toolbar"><button class="btn" onclick="openDeposit()">＋ Add DPS / FD</button></div><div class="panel"><h2>Deposits & maturity dates</h2><div class="tablewrap"><table><thead><tr><th>Type</th><th>Bank / title</th><th>Opening</th><th>Deposit / installment</th><th>Rate</th><th>Maturity</th><th>Expected amount</th><th>Actions</th></tr></thead><tbody>${db.deposits.map(d=>`<tr><td><span class="pill">${esc(d.type)}</span></td><td>${esc(d.name)}</td><td>${dateFmt(d.openDate)}</td><td>${money(d.type==='DPS'?d.installment:d.principal)}</td><td>${esc(d.rate||'—')}%</td><td>${dateFmt(d.maturityDate)}</td><td>${money(d.maturityAmount)}</td><td><button class="btn small secondary" onclick="openDeposit('${d.id}')">Edit</button> <button class="btn small danger" onclick="remove('deposits','${d.id}')">Delete</button></td></tr>`).join('')}</tbody></table></div>${!db.deposits.length?'<div class="empty">No DPS or fixed deposits yet.</div>':''}<p class="hint">Enter the bank's quoted maturity amount. Actual returns depend on the bank's terms, compounding, tax, and fees. Deposit records are separate from wallet transactions.</p></div>`}function reports(){const t=totals(),a=db.transactions.filter(x=>x.date.slice(0,7)===selectedMonth&&x.type==='expense');const groups=[...new Set(a.map(x=>x.category))].map(c=>({name:c,total:a.filter(x=>x.category===c).reduce((s,x)=>s+num(x.amount),0)})).filter(x=>x.total).sort((x,y)=>y.total-x.total);return `<div class="toolbar">${filterMonth()}<button class="btn secondary" onclick="exportCSV()">Export transactions CSV</button></div><div class="cards"><div class="card"><small>Income</small><strong>${money(t.income)}</strong></div><div class="card"><small>Expenses</small><strong>${money(t.expense)}</strong></div><div class="card"><small>Net monthly cash flow</small><strong>${money(t.income-t.expense)}</strong></div><div class="card"><small>Savings goal</small><strong>${money(db.settings.monthlyGoal)}</strong></div></div><div class="two"><div class="panel"><h2>Spending by category</h2><canvas id="chart" width="700" height="300"></canvas></div><div class="panel"><h2>Category breakdown</h2>${groups.map(g=>`<div class="listrow"><b>${g.name}</b><b>${money(g.total)}</b></div>`).join('')||'<div class="empty">No expenses for this month.</div>'}</div></div>`}function drawChart(){const canvas=document.getElementById('chart');if(!canvas)return;const ctx=canvas.getContext('2d'),names=[...new Set(db.transactions.filter(x=>x.type==='expense'&&x.date.slice(0,7)===selectedMonth).map(x=>x.category))],a=names.map(c=>({name:c,value:db.transactions.filter(x=>x.type==='expense'&&x.date.slice(0,7)===selectedMonth&&x.category===c).reduce((s,x)=>s+num(x.amount),0)})).filter(x=>x.value).sort((x,y)=>y.value-x.value).slice(0,7);ctx.clearRect(0,0,700,300);if(!a.length){ctx.fillStyle='#7b8d96';ctx.font='20px sans-serif';ctx.fillText('No expense data yet',30,100);return}const max=Math.max(...a.map(x=>x.value));a.forEach((x,i)=>{let y=20+i*40;ctx.fillStyle='#334c56';ctx.font='15px sans-serif';ctx.fillText(x.name.length>15?x.name.slice(0,14)+'…':x.name,8,y+15);ctx.fillStyle='#e6efed';ctx.fillRect(130,y,420,20);ctx.fillStyle='#0f9886';ctx.fillRect(130,y,420*x.value/max,20);ctx.fillStyle='#344f58';ctx.fillText(money(x.value),565,y+15)})}function settings(){return `<div class="two"><div class="panel"><h2>Data backup & recovery</h2><p class="muted">Your records are stored only in this browser. Back up regularly, especially before clearing browser data or changing devices.</p><div class="toolbar"><button class="btn" onclick="exportJSON()">Download JSON backup</button><label class="btn secondary" style="cursor:pointer">Restore JSON <input type="file" accept=".json,application/json" style="display:none" onchange="importJSON(this)"></label><button class="btn secondary" onclick="exportCSV()">Export CSV</button></div><p class="hint">Restoring a backup replaces all existing data. Keep your backup file private.</p></div><div class="panel"><h2>Preferences</h2><label class="field">Monthly savings goal (৳)<input id="goal" type="number" min="0" step="0.01" value="${num(db.settings.monthlyGoal)}"></label><div class="actions"><button class="btn" onclick="db.settings.monthlyGoal=Math.max(0,num(document.getElementById('goal').value));save();toast('Goal saved')">Save goal</button></div><hr style="border:0;border-top:1px solid #eee;margin:24px 0"><h2>Danger zone</h2><button class="btn danger" onclick="resetAll()">Delete all app data</button></div></div>`}function modal(title,body,submit){document.getElementById('modalRoot').innerHTML=`<div class="modalwrap" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>${title}</h2><form id="editor" onsubmit="event.preventDefault();${submit}"><div class="formgrid">${body}</div><div class="actions"><button type="button" class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" type="submit">Save</button></div></form></div></div>`}function closeModal(){document.getElementById('modalRoot').innerHTML=''}function field(name,label,value='',type='text',extra=''){return `<label class="field">${label}<input name="${name}" type="${type}" value="${esc(value)}" ${extra}></label>`}function select(name,label,opts,value){return `<label class="field">${label}<select name="${name}">${opts.map(o=>`<option value="${esc(o)}" ${o===value?'selected':''}>${esc(o)}</option>`).join('')}</select></label>`}function formData(){return Object.fromEntries(new FormData(document.getElementById('editor')).entries())}function openEntry(id){const t=db.transactions.find(x=>x.id===id)||{type:'expense',date:today(),category:'',account:'Cash',amount:'',note:''};editId=id||null;modal(id?'Edit transaction':'New transaction',select('type','Type',['expense','income'],t.type)+field('date','Date',t.date,'date','required')+field('amount','Amount (৳)',t.amount,'number','min="0.01" step="0.01" required')+field('category','Category / title',t.category,'text','required maxlength="80" list="walletCategories"')+`<datalist id="walletCategories">${[...new Set([...Object.keys(budget(t.date.slice(0,7)).categories||{}),...db.transactions.map(x=>x.category)])].map(c=>`<option value="${esc(c)}"></option>`).join('')}</datalist>`+select('account','Account',['Cash','Bank','bKash','Nagad','Rocket','Other'],t.account)+field('note','Description',t.note,'text','maxlength="120"'), 'saveEntry()')}function saveEntry(){const d=formData();if(num(d.amount)<=0)return alert('Enter an amount greater than zero.');const x={id:editId||uid(),type:d.type,date:d.date,amount:num(d.amount),category:d.category,account:d.account,note:d.note.trim()};const idx=db.transactions.findIndex(t=>t.id===editId);if(idx<0)db.transactions.push(x);else db.transactions[idx]=x;save();closeModal();render();toast('Transaction saved')}function budgetLine(name='',amount=''){return `<div class="budget-line" style="display:grid;grid-template-columns:1fr 130px auto;gap:8px;align-items:end;margin-bottom:10px"><label class="field">Category / title<input class="budget-name" type="text" maxlength="80" placeholder="e.g. Groceries" value="${esc(name)}"></label><label class="field">Budget (৳)<input class="budget-amount" type="number" min="0" step="0.01" value="${esc(amount)}"></label><button type="button" class="btn small danger" onclick="this.closest('.budget-line').remove()">Remove</button></div>`}function addBudgetLine(){document.getElementById('budgetLines').insertAdjacentHTML('beforeend',budgetLine())}function openBudget(){const b=budget(),rows=Object.entries(b.categories||{});modal('Plan budget · '+selectedMonth,field('total','Total monthly budget (৳)',b.total,'number','min="0" step="0.01" required')+`<div class="wide"><b>Your own categories</b><p class="hint">Write any category name and assign an amount. No preset categories.</p><div id="budgetLines">${rows.map(([n,v])=>budgetLine(n,v)).join('')}</div><button type="button" class="btn secondary" onclick="addBudgetLine()">＋ Add category</button></div>`,'saveBudget()')}function saveBudget(){const d=formData(),cats={},names=[...document.querySelectorAll('#budgetLines .budget-name')],amounts=[...document.querySelectorAll('#budgetLines .budget-amount')];for(let i=0;i<names.length;i++){const name=names[i].value.trim(),amount=num(amounts[i].value);if(!name){if(amounts[i].value!=='')return alert('Enter a category title.');continue}if(Object.keys(cats).some(k=>k.toLowerCase()===name.toLowerCase()))return alert('Duplicate category: '+name);if(amount<0)return alert('Budget amounts cannot be negative.');cats[name]=Math.max(0,amount)}db.budgets[selectedMonth]={total:Math.max(0,num(d.total)),categories:cats};save();closeModal();render();toast('Monthly budget saved')}function copyPrevious(){const [y,m]=selectedMonth.split('-').map(Number),prev=new Date(y,m-2,1).toLocaleDateString('en-CA').slice(0,7);if(!db.budgets[prev])return alert('No budget found for '+prev);if(!confirm('Replace the selected month budget with '+prev+'?'))return;db.budgets[selectedMonth]=JSON.parse(JSON.stringify(db.budgets[prev]));save();render()}function openDue(id){const d=db.dues.find(x=>x.id===id)||{type:'receivable',name:'',amount:'',paid:0,dueDate:today(),note:''};editId=id||null;modal(id?'Edit due / settlement':'New receivable or payable',select('type','Type',['receivable','payable'],d.type)+field('name','Person / reason',d.name,'text','required maxlength="100"')+field('amount','Original amount (৳)',d.amount,'number','min="0.01" step="0.01" required')+field('paid','Amount already settled (৳)',d.paid,'number','min="0" step="0.01" required')+field('dueDate','Due date',d.dueDate,'date')+field('note','Notes',d.note,'text'),'saveDue()')}function saveDue(){const d=formData();if(num(d.amount)<=0||num(d.paid)<0||num(d.paid)>num(d.amount))return alert('Check original and settled amounts.');const x={...d,id:editId||uid(),amount:num(d.amount),paid:num(d.paid)};const i=db.dues.findIndex(x=>x.id===editId);if(i<0)db.dues.push(x);else db.dues[i]=x;save();closeModal();render();toast('Due saved')}function openDeposit(id){const d=db.deposits.find(x=>x.id===id)||{type:'DPS',name:'',principal:0,installment:0,rate:'',openDate:today(),maturityDate:'',maturityAmount:0,nextPaymentDate:''};editId=id||null;modal(id?'Edit deposit':'New DPS / FD',select('type','Deposit type',['DPS','FD'],d.type)+field('name','Bank / deposit title',d.name,'text','required maxlength="100"')+field('principal','FD principal (৳)',d.principal,'number','min="0" step="0.01"')+field('installment','DPS monthly installment (৳)',d.installment,'number','min="0" step="0.01"')+field('rate','Annual interest rate (%)',d.rate,'number','min="0" step="0.01"')+field('openDate','Opening date',d.openDate,'date','required')+field('maturityDate','Maturity date',d.maturityDate,'date','required')+field('maturityAmount','Expected maturity amount (৳)',d.maturityAmount,'number','min="0" step="0.01" required')+field('nextPaymentDate','Next DPS payment date (optional)',d.nextPaymentDate,'date'),'saveDeposit()')}function saveDeposit(){const d=formData();if(d.maturityDate<d.openDate)return alert('Maturity date cannot be before opening date.');const x={...d,id:editId||uid(),principal:num(d.principal),installment:num(d.installment),rate:num(d.rate),maturityAmount:num(d.maturityAmount)};const i=db.deposits.findIndex(x=>x.id===editId);if(i<0)db.deposits.push(x);else db.deposits[i]=x;save();closeModal();render();toast('Deposit saved')}function remove(type,id){if(!confirm('Delete this record permanently?'))return;db[type]=db[type].filter(x=>x.id!==id);save();render();toast('Record deleted')}function download(name,content,mime){const blob=new Blob([content],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function exportJSON(){download('smart-wallet-backup-'+today()+'.json',JSON.stringify(db,null,2),'application/json');toast('Backup downloaded')}function exportCSV(){const keys=['date','type','category','amount','account','note'];const rows=[keys,...db.transactions.map(t=>keys.map(k=>t[k]??''))];const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');download('smart-wallet-transactions-'+today()+'.csv',csv,'text/csv;charset=utf-8')}async function importJSON(input){const file=input.files?.[0];if(!file)return;try{const d=JSON.parse(await file.text());if(!d||!Array.isArray(d.transactions)||!Array.isArray(d.dues)||!Array.isArray(d.deposits)||!d.budgets||typeof d.budgets!=='object'||Array.isArray(d.budgets))throw Error('Invalid backup');if(!confirm('Restore backup? This replaces ALL current app data.'))return;const old=db;db={...blank(),...d,settings:{...blank().settings,...d.settings}};if(!save()){db=old;return}render();toast('Backup restored')}catch(e){alert('Invalid or unreadable backup file.')}}function resetAll(){if(!confirm('Permanently erase ALL Smart Wallet data on this browser? Export a backup first.'))return;if(!confirm('Final confirmation: erase everything?'))return;db=blank();save();render();toast('All data cleared')}render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
